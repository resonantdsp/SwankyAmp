[vendor]
name = "Resonant DSP"
id = "com.resonantdsp"
url = "https://www.resonantdsp.com"
au_manufacturer = "Rsnt"

[[plugin]]
name = "Swanky Amp Free 2"
# Replace 2.0 bundles in the selected install scope; leave 1.4 untouched.
previous_names = ["Swanky Amp 2", "Swanky Amp Free"]
previous_standalone_binaries = ["swanky-amp-2"]
artifact_name = "swanky-amp-free"
bundle_id = "swanky-amp-2"
crate = "swanky-amp"
fourcc = "SwA2"
category = "effect"
vst3_subcategory = "Distortion"
# The standalone app's icon, the Resonant DSP mark from the website's favicon.
# Windows embeds it in the .exe, which the Start menu shortcut shows.
windows_icon = "assets/app-icon.ico"
macos_icon = "assets/app-icon.icns"

# The editor checks for a newer release over the network and imports and saves
# presets as files outside a host's container, so the Audio Unit states both to
# a sandboxed host such as GarageBand instead of claiming to be sandbox-safe.
[plugin.au_resource_usage]
network_client = true
files_read_write = true

# Named rather than read from the default features: those would bring Audio
# Unit version 3, whose container app takes the standalone app's place.
[packaging]
formats = ["clap", "vst3", "au2", "standalone"]

# Distribution packages are notarized and stapled. Local packaging can opt out
# explicitly with --no-notarize; candidate builds may not.
[macos.packaging]
notarize = true

# The Windows installer and its Apps & Features entry show the same mark.
[windows.packaging]
installer_icon = "assets/app-icon.ico"
