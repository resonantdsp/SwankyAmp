name: promote

# Promotion is the publishing act, and it never builds. An operator tags the
# release on the qualified candidate's commit and dispatches this from master.
# It takes the candidate's own bytes from the downloads bucket, checks them
# against the record a person accepted and the tagged tree, copies them to the
# release prefix, proves the public URLs serve them, publishes the GitHub
# release and opens the website's catalogue pull request. Whether a candidate
# deserves that stays a person's judgement, recorded in the qualification.
on:
  workflow_dispatch:
    inputs:
      candidate_tag:
        description: "Qualified candidate tag: vX.Y.Z-rc.N"
        required: true
        type: string
      tag:
        description: "Release tag on the same commit: vX.Y.Z"
        required: true
        type: string
      record_sha256:
        description: "Accepted SHA-256 of the candidate's release-record.json"
        required: true
        type: string
      qualification:
        description: "Who qualified this candidate, in which hosts, on which machines, when, and what they found"
        required: true
        type: string

# The release prefix is written once per version; two promotions would race on it.
concurrency:
  group: promote
  cancel-in-progress: false

permissions: {}

jobs:
  promote:
    name: promote
    runs-on: ubuntu-24.04
    # Holds the credential that writes the downloads bucket and the website
    # token, and admits only master.
    environment: release
    permissions:
      # Publishing the release is the only thing this writes to the repository.
      contents: write
      # To find the candidate's own workflow run.
      actions: read
    env:
      CANDIDATE_TAG: ${{ inputs.candidate_tag }}
      TAG: ${{ inputs.tag }}
      RECORD_SHA256: ${{ inputs.record_sha256 }}
      QUALIFICATION: ${{ inputs.qualification }}
      WEBSITE_REPO: resonantdsp/website
      PUBLIC_DOWNLOAD_BUCKET: ${{ vars.PUBLIC_DOWNLOAD_BUCKET }}
      PUBLIC_DOWNLOAD_BASE_URL: ${{ vars.PUBLIC_DOWNLOAD_BASE_URL }}
    steps:
      # The release environment admits only a dispatch from master. A tag input
      # naming a branch would run that branch's scripts with its secrets;
      # release tags are administrator-only, so the tree checked out below is
      # one an administrator made.
      - name: Require tag inputs and a qualification
        run: |
          [[ $TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "'$TAG' is not a release tag: expected vX.Y.Z." >&2
            exit 1
          }
          [[ $CANDIDATE_TAG =~ ^v[0-9]+\.[0-9]+\.[0-9]+-rc\.[1-9][0-9]*$ ]] || {
            echo "'$CANDIDATE_TAG' is not a candidate tag: expected vX.Y.Z-rc.N." >&2
            exit 1
          }
          if [ -z "$(printf '%s' "$QUALIFICATION" | tr -d '[:space:]')" ]; then
            echo "The qualification names who qualified this candidate, where, when and what they found." >&2
            exit 1
          fi
      # The whole history, so both tags resolve and the build number matches.
      # The repository token stays out of the tree's git config.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - name: Require a successful candidate run for the candidate tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          commit=$(git rev-list -n 1 "$CANDIDATE_TAG")
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/candidate.yml/runs?event=push&status=success&head_sha=$commit" \
            --jq "any(.workflow_runs[]; .head_branch == \"$CANDIDATE_TAG\")" | grep -qx true || {
            echo "No successful candidate run built $CANDIDATE_TAG at $commit." >&2
            exit 1
          }
      - name: Fetch the candidate and check it against the accepted record and the tagged tree
        run: |
          python3 scripts/release_contract.py fetch \
            "$PUBLIC_DOWNLOAD_BASE_URL/swankyamp/candidates/$CANDIDATE_TAG" candidate
          python3 scripts/release_contract.py verify "$CANDIDATE_TAG" "$TAG" "$RECORD_SHA256" candidate
          {
            printf '# Qualification of %s from %s\n\n' "$TAG" "$CANDIDATE_TAG"
            printf 'Accepted release-record SHA-256: `%s`\n\n' "$RECORD_SHA256"
            printf '%s\n' "$QUALIFICATION"
          } > candidate/qualification.md
          echo "VERSION=$(jq -r .version candidate/release-record.json)" >> "$GITHUB_ENV"
      # A release that already exists is a rerun after a later step failed: it
      # goes on only if every asset is the candidate's, the qualification
      # included, so a rerun takes the same qualification text.
      - name: Refuse a release that holds other bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release download "$TAG" --dir published 2>/dev/null; then
            diff -r candidate published
          fi
      - name: Copy the candidate to the release prefix
        env:
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          aws --endpoint-url "https://$R2_ACCOUNT_ID.r2.cloudflarestorage.com" \
            s3 cp candidate/ "s3://$PUBLIC_DOWNLOAD_BUCKET/swankyamp/$VERSION/" --recursive
      # Before anything points at them: the public URLs serve exactly the
      # candidate's bytes.
      - name: Prove the public URLs
        run: |
          python3 scripts/release_contract.py fetch "$PUBLIC_DOWNLOAD_BASE_URL/swankyamp/$VERSION" public
          for file in public/*; do cmp "$file" "candidate/${file##*/}"; done
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            {
              awk -v version="$VERSION" '
                $0 ~ "^## " version "( |$)" { printing = 1; next }
                printing && /^## / { exit }
                printing { print }
              ' CHANGELOG.md
              printf '\n## Qualification\n\nCandidate: %s\n\n%s\n' "$CANDIDATE_TAG" "$QUALIFICATION"
            } > notes.md
            gh release create "$TAG" --verify-tag --latest --title "$TAG" --notes-file notes.md candidate/*
          fi
          gh release view "$TAG" --json url,publishedAt \
            --jq '"RELEASE_URL=\(.url)\nRELEASED_AT=\(.publishedAt[0:10])"' >> "$GITHUB_ENV"
      # The website's checks and the operator's review merge this; promotion
      # opens it and stops. The catalogue check runs the website master's own
      # code, so promotion trusts that branch.
      - name: Open the website catalogue pull request
        env:
          GH_TOKEN: ${{ secrets.WEBSITE_TOKEN }}
        run: |
          # The token reaches git through a helper that reads it from the
          # environment, so it is never written to a config file or a URL.
          git config --global credential."https://github.com".helper \
            '!f() { printf "username=x-access-token\npassword=%s\n" "$GH_TOKEN"; }; f'
          git clone --depth 1 --branch master "https://github.com/$WEBSITE_REPO.git" website
          node scripts/website-release.mjs site --record candidate/release-record.json \
            --base-url "$PUBLIC_DOWNLOAD_BASE_URL" --site website/site --released-at "$RELEASED_AT"
          {
            printf 'Swanky Amp %s is qualified and its bytes are public.\n\n' "$VERSION"
            printf 'Release: %s\n\nCandidate: %s, build %s, record SHA-256 `%s`\n\n' \
              "$RELEASE_URL" "$CANDIDATE_TAG" "$(jq .build candidate/release-record.json)" "$RECORD_SHA256"
            printf '| Download | Bytes | SHA-256 |\n| --- | --- | --- |\n'
            jq -r --arg base "$PUBLIC_DOWNLOAD_BASE_URL/swankyamp/$VERSION" \
              '.artifacts[] | "| [\(.platform) \(.architecture)](\($base)/\(.name)) | \(.bytes) | `\(.sha256)` |"' \
              candidate/release-record.json
            printf '\nEvery URL above served exactly these bytes before this pull request was opened.\n\n'
            printf '## Qualification\n\n%s\n' "$QUALIFICATION"
          } > pr-body.md
          branch="release/swanky-amp-2-$VERSION"
          cd website
          git config user.name "resonantdsp release"
          git config user.email "releases@resonantdsp.com"
          git switch -c "$branch"
          git add site/src/data/releases.json site/src/data/site.json
          if git diff --quiet --cached; then
            echo "The catalogue already lists Swanky Amp $VERSION."
            exit 0
          fi
          git commit -m "Catalogue Swanky Amp $VERSION downloads"
          # The promotion owns this branch: a rerun replaces its own commit.
          git fetch origin "refs/heads/$branch:refs/remotes/origin/$branch" || true
          git push --force-with-lease origin "HEAD:refs/heads/$branch"
          existing=$(gh pr list --repo "$WEBSITE_REPO" --head "$branch" --state open --json url --jq '.[0].url // empty')
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --body-file ../pr-body.md
          else
            gh pr create --repo "$WEBSITE_REPO" --base master --head "$branch" \
              --title "Swanky Amp $VERSION downloads" --body-file ../pr-body.md
          fi
