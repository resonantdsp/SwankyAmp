name: check

# Prose cannot change what these jobs measure.
#
# The skip is decided by the `changes` job rather than by `paths-ignore`,
# because a workflow filtered out by path never reports its checks at all, and
# a required check that never reports leaves a pull request confined to prose
# waiting forever. A skipped job satisfies a required check, so the jobs always
# exist and decline to do the work instead.
#
# `checks` declines at the job level. `bundles` cannot: a matrix job whose
# job-level `if` is false never expands its matrix, so it reports one check
# named for the unresolved expression and the two per-platform names never
# appear. Its legs therefore always start, and every step declines instead,
# so each leg reports its real name and finishes in seconds.
#
# Within `checks`, the reference and model comparisons run only when one of
# their inputs changed: the frozen 1.4.0 fixture cannot move otherwise, and
# the model comparison renders nothing that other code can change.
#
# `bundles` also waits for `checks`, so the twenty-minute builds are not spent
# on a change that already failed. Its legs start even when `checks` fails or
# is skipped; after a failure, or a failed `changes`, each leg fails at once
# rather than declining, so no green bundle check stands for work never done.
on:
  push:
    branches: [master]
  pull_request:

# A newer push to the same ref makes the older answer irrelevant.
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# A hung step, such as a stalled package install, otherwise runs to GitHub's
# six-hour limit. Each timeout is several times the job's slowest run in
# October 2026 (changes under a minute, checks 8, bundles 8 minutes), and
# leaves room for a build on a cold dependency cache.
jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      code: ${{ steps.filter.outputs.code }}
      reference: ${{ steps.filter.outputs.reference }}
      model: ${{ steps.filter.outputs.model }}
    steps:
      # The base commit has to be in the clone for the diff below, and neither
      # a pull request's base nor the commit a push started from is reachable
      # from a shallow checkout of the head.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail
          # A first push to a branch names no predecessor, and a force push can
          # leave one that no longer exists; either way nothing can be ruled
          # out, so everything counts as changed.
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base commit; treating every path as changed."
            printf 'code=true\nreference=true\nmodel=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # On a pull request HEAD is the merge of the head into the base, so
          # this diff is the pull request's own changes.
          # A moved file counts under its old path as well as its new one.
          files=$(git diff --no-renames --name-only "$BASE" "$GITHUB_SHA")
          echo "Changed files:"
          echo "$files"
          code=false
          reference=false
          model=false
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            case "$file" in
              *.md) continue ;;
            esac
            code=true
            case "$file" in
              verification/reference/* | Justfile | .github/workflows/check.yml) reference=true ;;
            esac
            case "$file" in
              src/dsp/* | src/bin/render-model.rs | src/engine.rs | src/presets.rs \
                | verification/* | Cargo.toml | Cargo.lock | rust-toolchain.toml \
                | Justfile | .github/workflows/check.yml)
                model=true ;;
            esac
          done <<< "$files"
          echo "code=$code reference=$reference model=$model"
          printf 'code=%s\nreference=%s\nmodel=%s\n' "$code" "$reference" "$model" >> "$GITHUB_OUTPUT"

  checks:
    name: checks (linux)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # alsa-sys is the only dependency that resolves a system library at build
      # time, and it reaches the default feature set through the standalone's
      # audio backend, which clippy checks here. The window, GPU and portal
      # libraries are opened at run time, so a check needs none of them.
      - run: sudo apt-get update && sudo apt-get install --no-install-recommends -y pkg-config libasound2-dev
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        with:
          just-version: "1.58.0"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24.21.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # A failed check is the usual outcome, and it must not discard the dependency build.
          cache-on-failure: true
      - run: just ci-checks
      - run: just reference-check
        if: needs.changes.outputs.reference == 'true'
      - run: just model-check
        if: needs.changes.outputs.model == 'true'

  bundles:
    name: bundles (${{ matrix.os }})
    needs: [changes, checks]
    if: ${{ !cancelled() }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-2025]
    steps:
      - name: Require passing checks
        if: needs.changes.result != 'success' || (needs.checks.result != 'success' && needs.checks.result != 'skipped')
        shell: bash
        run: |
          echo "changes: ${{ needs.changes.result }}, checks: ${{ needs.checks.result }}; bundles not built."
          exit 1
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        if: needs.changes.outputs.code == 'true'
      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4.0.0
        if: needs.changes.outputs.code == 'true'
        with:
          just-version: "1.58.0"
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        if: needs.changes.outputs.code == 'true'
        with:
          # A failed check is the usual outcome, and it must not discard the dependency build.
          cache-on-failure: true
          # One cache per platform rather than per job, so the candidate tier
          # starts from the dependency build this tier already paid for.
          shared-key: bundles-${{ matrix.os }}
      # The ASIO SDK the Windows standalone builds with, which `just setup`
      # downloads on a miss. Restored unchanged, it leaves asio-sys built.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: needs.changes.outputs.code == 'true' && runner.os == 'Windows'
        with:
          path: tools/ASIOSDK
          key: asio-sdk-${{ hashFiles('scripts/install-asio-sdk.sh') }}
      # Windows has no POSIX shell by default; the recipes are written for bash,
      # which the runner image provides.
      - run: just setup
        if: needs.changes.outputs.code == 'true'
        shell: bash
      - run: just ci-bundles
        if: needs.changes.outputs.code == 'true'
        shell: bash
