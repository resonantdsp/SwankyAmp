[package]
name = "swanky-amp"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/resonantdsp/SwankyAmp"
publish = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "swanky-amp-2"
path = "src/main.rs"
required-features = ["standalone"]

[[bin]]
name = "render-model"
path = "src/bin/render-model.rs"

[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
standalone = ["dep:truce-standalone"]

[dependencies]
truce = { version = "=6.3.0", default-features = false }
truce-clap = { version = "=6.3.0", optional = true }
clap-sys = { version = "0.5", optional = true }
truce-vst3 = { version = "=6.3.0", optional = true }
truce-standalone = { version = "=6.3.0", features = ["gui"], optional = true }
truce-iced = "=6.3.0"
truce-params = "=6.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
bytemuck = { version = "1", features = ["derive"] }
exr = { version = "1.74", default-features = false, features = ["rayon"] }
iced_core = "0.14"
iced_graphics = "0.14"
iced_runtime = "0.14"
iced_widget = { version = "0.14", features = ["wgpu"] }
iced_wgpu = "0.14"
dirs = "5"
ureq = { version = "3", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }

[dev-dependencies]
truce-test = "=6.3.0"

[patch.crates-io]
baseview-truce = { path = "vendor/baseview-truce" }
truce-clap = { path = "vendor/truce-clap" }
truce-iced = { path = "vendor/truce-iced" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
