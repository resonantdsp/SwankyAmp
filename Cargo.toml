[package]
name = "swanky-amp"
version = "2.0.0"
edition = "2024"
rust-version = "1.92"
license = "GPL-3.0-or-later"
repository = "https://github.com/resonantdsp/SwankyAmp"
publish = false
# Binaries are declared below so that a new file in src/bin cannot join the
# plug-in format builds without the `tools` gate.
autobins = false
default-run = "swanky-amp-2"

# The release's own statement of whether it ships a Linux download. A
# candidate builds exactly the declared downloads and fails without any of
# them; macOS and Windows always ship. 2.0 ships no Linux download until
# the Linux build has been tried on a real machine (see the README's
# qualification section).
[package.metadata.release]
linux = false

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "swanky-amp-2"
path = "src/main.rs"
required-features = ["standalone"]

# The offline measurement tools sit behind the `tools` feature because
# cargo-truce builds every binary of the package for each plug-in format, and
# link-optimising seven tools per format cost minutes of each bundle build.
[[bin]]
name = "render-model"
path = "src/bin/render-model.rs"
required-features = ["tools"]

[[bin]]
name = "dsp-probe"
path = "src/bin/dsp-probe.rs"
required-features = ["tools"]

[[bin]]
name = "refit-tone"
path = "src/bin/refit-tone.rs"
required-features = ["tools"]

[[bin]]
name = "soak"
path = "src/bin/soak.rs"
required-features = ["tools"]

[[bin]]
name = "tone-stack-soak"
path = "src/bin/tone-stack-soak.rs"
required-features = ["tools"]

[[bin]]
name = "fit-cabinet"
path = "src/bin/fit-cabinet.rs"
required-features = ["tools"]

[[bin]]
name = "calibrate"
path = "src/bin/calibrate.rs"
required-features = ["tools"]

[features]
default = ["clap", "vst3", "standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
au = ["dep:truce-au"]
standalone = ["dep:truce-standalone"]
# Runs the Windows standalone on ASIO when a driver is installed. Building it
# needs the ASIO SDK (`just setup` fetches it) and libclang, so only the
# Windows recipes enable it.
asio = ["truce-standalone?/asio"]
rt-paranoid = ["truce/rt-paranoid"]
# Builds the offline measurement tools in src/bin; the recipes that run them
# turn it on.
tools = []

[dependencies]
truce = { version = "=6.3.0", default-features = false }
truce-clap = { version = "=6.3.0", optional = true }
clap-sys = { version = "0.5", optional = true }
truce-vst3 = { version = "=6.3.0", optional = true }
truce-au = { version = "=6.3.0", optional = true }
truce-standalone = { version = "=6.3.0", features = ["gui"], optional = true }
truce-iced = "=6.3.0"
truce-params = "=6.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
flate2 = "1"
hound = "3.5.1"
bytemuck = { version = "1", features = ["derive"] }
exr = { version = "1.74", default-features = false, features = ["rayon"] }
iced_core = "0.14"
iced_graphics = "0.14"
iced_runtime = "0.14"
iced_widget = { version = "0.14", features = ["wgpu"] }
iced_wgpu = "0.14"
dirs = "5"
rfd = "=0.15.4"
roxmltree = "0.20"
unicode-segmentation = "1.13.3"
ureq = { version = "3", default-features = false, features = [
  "rustls-no-provider",
  "platform-verifier",
] }
rustls = { version = "0.23", default-features = false, features = [
  "ring",
  "std",
  "tls12",
] }

# The account's home folder, which a sandboxed host hides behind HOME.
[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"

# The support report reads the Windows release from the registry, the
# library pins itself in memory before the editor starts its threads, and
# links open through the shell.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_LibraryLoader",
  "Win32_System_Registry",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
truce-test = "=6.3.0"

[patch.crates-io]
baseview-truce = { path = "vendor/baseview-truce" }
truce-clap = { path = "vendor/truce-clap" }
truce-au = { path = "vendor/truce-au" }
truce-iced = { path = "vendor/truce-iced" }
truce = { path = "vendor/truce" }
truce-core = { path = "vendor/truce-core" }
truce-loader = { path = "vendor/truce-loader" }
truce-plugin = { path = "vendor/truce-plugin" }
truce-standalone = { path = "vendor/truce-standalone" }

[profile.dev]
debug = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
strip = true
